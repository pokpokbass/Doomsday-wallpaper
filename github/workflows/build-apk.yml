
name: Build Doomsday Wallpaper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Extract project
        run: |
          mkdir project-source
          unzip -q DoomsdayLiveWallpaper_PhoneOnly_Build.zip -d project-source

      - name: Build APK
        working-directory: project-source/DoomsdayLiveWallpaper
        run: ../../gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doomsday-countdown-apk
          path: project-source/DoomsdayLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
